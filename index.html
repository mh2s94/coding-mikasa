<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIKASA — IT’S ME ADDY · Coding Reel v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;width:100%;margin:0 auto;padding:12px;min-height:100vh;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center}
canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#000;border-radius:10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
button{background:#ff5b14;color:#000;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px}
input[type=range]{flex:1;min-width:120px;accent-color:#ff5b14}
#tc{font-variant-numeric:tabular-nums;color:#888;font-size:13px;min-width:78px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<div style="position:relative"><canvas id="c" width="1280" height="720"></canvas>
<button id="sn" aria-label="Suara" style="position:absolute;right:12px;bottom:18px;background:rgba(0,0,0,.35);color:#fff;border:1px solid #444;width:38px;height:38px;padding:0;font-size:17px;border-radius:50%">🔇</button></div>

</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720,D=20;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const outCubic=x=>1-Math.pow(1-x,3),inCubic=x=>x*x*x,inOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const outBack=x=>{const c=2.70158;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const ANTON=s=>`${s}px Anton, Impact, "Arial Black", sans-serif`;
const MONO=s=>`700 ${s}px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace`;
const ORG='#ff5b14',INK='#0a0a0a',PAPER='#f2efe6',MINT='#7dffb2',AMB='#ffb800';
const S=[0,2.5,5.7,9.2,11.7,20];

function T(str,x,y,size,fill,o={}){
  ctx.save();ctx.font=(o.f||ANTON)(size);ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);ctx.scale(o.sx!=null?o.sx:(o.sc||1),o.sy!=null?o.sy:(o.sc||1));
  if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.gb||30}
  if(o.stroke){ctx.lineWidth=o.lw||3;ctx.strokeStyle=o.stroke;ctx.strokeText(str,0,0)}
  if(fill){ctx.fillStyle=fill;ctx.fillText(str,0,0)}
  ctx.restore();
}
function igIcon(x,y,s,a){
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);
  const g=ctx.createLinearGradient(-s/2,s/2,s/2,-s/2);g.addColorStop(0,AMB);g.addColorStop(.5,ORG);g.addColorStop(1,'#ff2d7a');
  ctx.strokeStyle=g;ctx.lineWidth=s*.09;
  ctx.beginPath();ctx.roundRect(-s/2,-s/2,s,s,s*.28);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,s*.22,0,6.283);ctx.stroke();
  ctx.fillStyle=ORG;ctx.beginPath();ctx.arc(s*.26,-s*.26,s*.06,0,6.283);ctx.fill();ctx.restore();
}
/* 1 — boot log */
const BOOT=['init kernel','mount /dev/creative','load fonts','compile shaders','start motion.engine','link brain.js','allocate coffee','warm up GPU','parse ideas','render dreams','ready.'];
function s1(t){
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  const shown=Math.floor(t/.11);
  for(let i=0;i<=Math.min(shown,22);i++){
    const k=shown-i,row=21-i;if(k<0)continue;
    const y=70+row*28,txt=BOOT[k%BOOT.length],hex='0x'+Math.floor(rnd(k)*65535).toString(16).padStart(4,'0').toUpperCase();
    T(hex,50,y,20,'#555',{f:MONO,align:'left',alpha:.8});
    T('[ OK ]',170,y,20,MINT,{f:MONO,align:'left'});
    T(txt,290,y,20,PAPER,{f:MONO,align:'left',alpha:Math.max(.25,1-i*.04)});
  }
  const p=seg(t,1.3,1.5);
  if(p>0){
    ctx.fillStyle=`rgba(10,10,10,${.88*p})`;ctx.fillRect(0,0,W,H);
    const txt='HELLO, WORLD',n=Math.floor(seg(t,1.4,2.1)*txt.length);
    T(txt.slice(0,n),W/2,H/2,170,PAPER,{glow:'rgba(255,91,20,.5)'});
    if(Math.floor(t*5)%2===0){ctx.font=ANTON(170);const w=ctx.measureText(txt.slice(0,n)).width;ctx.fillStyle=ORG;ctx.fillRect(W/2+w/2+8,H/2-95,22,190)}
  }
}
/* 2 — kinetic languages */
const WORDS=['HTML','CSS','JAVASCRIPT','PYTHON','REACT','GIT'];
const SNIP=['<div class="reel">','  const x = await fetch(url);','def render(frame): return',"import { motion } from 'ui'",'.title { transform: scale(1) }','git commit -am "ship it"','for (let i=0;i<60;i++) draw(i)','SELECT * FROM ideas;'];
function s2(t){
  const i=Math.min(5,Math.floor(t/.5)),lt=t-i*.5,p=outExpo(seg(lt,0,.28));
  const bg=[ORG,PAPER,INK,MINT,ORG,PAPER][i],fg=[INK,INK,PAPER,INK,INK,ORG][i];
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let r=0;r<14;r++){T(SNIP[(r+i)%8],((r%2?-1:1)*t*160)+(r%2?W-40:40),30+r*52,26,fg,{f:MONO,align:r%2?'right':'left',alpha:.13})}
  ctx.font=ANTON(100);const w100=ctx.measureText(WORDS[i]).width,size=Math.min(380,1120/w100*100),m=i%3;
  if(m===0){for(let k=3;k>=1;k--)T(WORDS[i],W/2,H/2,size,null,{stroke:fg,lw:2,sc:1+k*.18*(1-p),alpha:.5*(1-p)});T(WORDS[i],W/2,H/2,size,fg,{sc:2-p,alpha:p})}
  else if(m===1)T(WORDS[i],W/2,H/2,size,fg,{sx:1+3*(1-p),sy:1-.4*(1-p),alpha:clamp(p*2)});
  else T(WORDS[i],W/2,H/2,size,fg,{sy:-1+2*p,alpha:clamp(p*2)});
  ctx.fillStyle=fg;ctx.fillRect(60,H-90,(W-120)*(i+p)/6,8);
  T('0'+(i+1)+' / 06',W-60,H-120,30,fg,{f:MONO,align:'right'});
}
/* 3 — git graph */
const LANES=[
 {c:ORG,y:250,d:[100,200,300,800,980,1180],m:['init','feat: nav','merge','merge','release','v1.0']},
 {c:MINT,y:360,d:[400,500,600,700],m:['add reel','fix bug','refactor','tests']},
 {c:AMB,y:150,d:[640,770,900],m:['hotfix','patch','ok']}];
function s3(t){
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(242,239,230,.06)';ctx.lineWidth=1;for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  const rx=100+seg(t,.3,2.7)*1100,inn=seg(t,0,.3);
  T('$ git log --graph',60,70,36,PAPER,{f:MONO,align:'left',alpha:inn});
  ctx.save();ctx.beginPath();ctx.rect(0,0,rx,H);ctx.clip();ctx.lineWidth=8;ctx.lineCap='round';
  ctx.strokeStyle=ORG;ctx.beginPath();ctx.moveTo(100,250);ctx.lineTo(1180,250);ctx.stroke();
  ctx.strokeStyle=MINT;ctx.beginPath();ctx.moveTo(300,250);ctx.bezierCurveTo(350,250,350,360,400,360);ctx.lineTo(700,360);ctx.bezierCurveTo(750,360,750,250,800,250);ctx.stroke();
  ctx.strokeStyle=AMB;ctx.beginPath();ctx.moveTo(560,250);ctx.bezierCurveTo(610,250,590,150,640,150);ctx.lineTo(900,150);ctx.bezierCurveTo(950,150,930,250,980,250);ctx.stroke();
  ctx.restore();
  LANES.forEach(l=>l.d.forEach((x,k)=>{
    const e=outBack(clamp((rx-x)/70));if(e<=0)return;
    ctx.fillStyle=INK;ctx.strokeStyle=l.c;ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,l.y,16*e,0,6.283);ctx.fill();ctx.stroke();
    T(l.m[k],x,l.y+(l.y<250?-44:44),22,l.c,{f:MONO,alpha:clamp(e)});
  }));
  const f=seg(t,2.7,3.2);
  T('git merge --no-fear',W/2,590,58,ORG,{f:MONO,alpha:seg(t,2.2,2.6)});
  if(f>0){ctx.fillStyle=PAPER;ctx.globalAlpha=(1-f)*.4;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
/* 4 — build */
function s4(t){
  ctx.fillStyle=ORG;ctx.fillRect(0,0,W,H);
  const e=outExpo(seg(t,0,.7)),pc=Math.floor(outCubic(seg(t,.4,2))*100);
  ctx.fillStyle=INK;ctx.globalAlpha=.1;for(let r=0;r<18;r++)T(Array.from({length:30},(_,k)=>Math.floor(rnd(r*30+k+Math.floor(t*10))*16).toString(16)).join(' '),40,30+r*40,24,INK,{f:MONO,align:'left'});
  ctx.globalAlpha=1;
  T('{',W/2-(1-e)*900-430,H/2,700,INK);T('}',W/2+(1-e)*900+430,H/2,700,INK);
  T('BUILDING',W/2,H/2-170,60,INK,{f:MONO,alpha:e});
  T(pc+'%',W/2,H/2,280,PAPER,{alpha:e});
  ctx.fillStyle=INK;ctx.fillRect(220,H/2+170,840,22);ctx.fillStyle=PAPER;ctx.fillRect(224,H/2+174,832*pc/100,14);
  if(pc>=100)T('✔ DEPLOYED',W/2,H/2+250,56,INK,{f:MONO,sc:1+.1*Math.sin(t*14)});
}
/* 5 — name reveal */
function rise(str,size,cy,base,t,col){
  ctx.font=ANTON(size);const sp=10,w=[...str].map(c=>ctx.measureText(c).width),tot=w.reduce((a,b)=>a+b,0)+sp*(str.length-1);let x=W/2-tot/2;
  [...str].forEach((ch,i)=>{
    const cw=w[i],cx=x+cw/2;x+=cw+sp;const d=base+i*.08,p=seg(t,d,d+.55);if(p<=0)return;
    const top=cy-size*.62,hh=size*1.24;
    ctx.fillStyle=ORG;ctx.fillRect(cx-cw/2-4,top,cw+8,hh*Math.sin(Math.min(1,p*1.6)*Math.PI/2)*(1-outCubic(seg(p,.5,1))));
    ctx.save();ctx.beginPath();ctx.rect(cx-cw/2-14,top,cw+28,hh);ctx.clip();
    T(ch,cx,cy+(1-outExpo(seg(p,.25,1)))*hh,size,col,{sy:1+.25*(1-p),glow:'rgba(255,91,20,.55)',gb:36});ctx.restore();
  });
}
function s5(t){
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t*.02);ctx.strokeStyle='rgba(242,239,230,.05)';ctx.lineWidth=1;
  for(let k=-30;k<=30;k++){ctx.beginPath();ctx.moveTo(k*50,-1400);ctx.lineTo(k*50,1400);ctx.stroke();ctx.beginPath();ctx.moveTo(-1400,k*50);ctx.lineTo(1400,k*50);ctx.stroke()}
  ctx.restore();
  for(let k=0;k<3;k++){const r=((t*.3+k/3)%1);ctx.strokeStyle=ORG;ctx.globalAlpha=(1-r)*.25;ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,r*760,0,6.283);ctx.stroke()}
  ctx.globalAlpha=1;
  const fa=1-seg(t,3.9,4.3),cmd='> whoami',n=Math.floor(clamp((t-.05)/.4)*cmd.length);
  T(cmd.slice(0,n),60,80,34,MINT,{f:MONO,align:'left',alpha:fa});
  T('// loading identity...',60,122,22,'#777',{f:MONO,align:'left',alpha:seg(t,.5,.7)*fa});
  if(t<4.5){
    ctx.save();ctx.translate(0,-H*inCubic(seg(t,4,4.45))+Math.sin(t*2.4)*6);
    rise('MIKASA',280,H/2-20,.5,t,PAPER);
    ctx.fillStyle=ORG;const uw=860*outExpo(seg(t,1.6,2.1));ctx.fillRect(W/2-uw/2,H/2+150,uw,7);
    T('CREATIVE CODER',W/2,H/2+210,30,'#999',{f:MONO,alpha:seg(t,1.9,2.3)});
    ctx.restore();
  }
  if(t>=4.4){
    const a=outExpo(seg(t,4.65,5.05));
    T('IT’S ME',W/2,195,72,MINT,{f:MONO,alpha:a,sc:.8+.2*a,glow:MINT});
    ctx.save();ctx.translate(0,Math.sin(t*2.2)*5*seg(t,5.8,6.2));rise('ADDY',290,385,4.85,t,PAPER);ctx.restore();
    ctx.fillStyle=AMB;const uw=640*outExpo(seg(t,5.6,6.05));ctx.fillRect(W/2-uw/2,505,uw,7);
    const b=outBack(seg(t,5.95,6.45));ctx.font=ANTON(80);const tw=ctx.measureText('@mh2s___').width;
    const g=ctx.createLinearGradient(W/2-tw/2,0,W/2+tw/2,0);g.addColorStop(0,AMB);g.addColorStop(.5,ORG);g.addColorStop(1,'#ff2d7a');
    igIcon(W/2-tw/2-62,595+(1-b)*60,76,clamp(b));T('@mh2s___',W/2+40,595+(1-b)*60,80,g,{alpha:clamp(b)});
    T('CREATIVE CODING REEL  ·  2026',W/2,670,24,'#888',{f:MONO,alpha:seg(t,6.6,7)});
  }
}
function hud(t){
  if(!AC||AC.state!=='running')T('🔇 ketuk layar untuk suara',W/2,H-34,20,'#fff',{f:MONO,alpha:.55+.3*Math.sin(t*5)});
  ctx.globalAlpha=.75;
  T('git commit -m "MIKASA IS ADDY"',30,690,16,'#ccc',{f:MONO,align:'left'});
  T('REC ● '+String(Math.floor(t)).padStart(2,'0')+':'+String(Math.floor(t*30)%30).padStart(2,'0'),W-30,34,18,'#ccc',{f:MONO,align:'right'});
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(0,H-6,W,6);ctx.fillStyle=ORG;ctx.fillRect(0,H-6,W*t/D,6);ctx.globalAlpha=1;
}
function render(t){
  ctx.clearRect(0,0,W,H);
  if(t<S[1])s1(t);else if(t<S[2])s2(t-S[1]);else if(t<S[3])s3(t-S[2]);else if(t<S[4])s4(t-S[3]);else s5(t-S[4]);
  for(let i=1;i<5;i++){const b=S[i],w=.25;
    if(t>b-w&&t<b+w)for(let k=0;k<8;k++){const q=clamp((t-(b-w)-k*.025)/(2*w-.2));ctx.fillStyle=(k+i)%2?ORG:PAPER;ctx.fillRect(k*W/8,-H+q*2*H,W/8+1,H)}}
  hud(t);
  const v=ctx.createRadialGradient(W/2,H/2,H*.5,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
/* ---------- SOUND (Web Audio, synthesized) ---------- */
let AC=null,master=null,snd=false,NB=null;
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function tone(f,dur,type,vol,to){if(!snd||AC.state!=='running')return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+dur);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(master);o.start(n);o.stop(n+dur+.02)}
function noise(dur,vol,f1,f2,type,sw){if(!snd||AC.state!=='running')return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),n=AC.currentTime;s.buffer=NB;fl.type=type||'bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f1,n);fl.frequency.exponentialRampToValueAtTime(f2,n+dur);
  if(sw){g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(vol,n+dur*.8)}else g.gain.setValueAtTime(vol,n);
  g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(n);s.stop(n+dur+.02)}
const kick=()=>tone(160,.2,'sine',.6,38),hat=()=>noise(.05,.07,7000,9000,'highpass'),blip=f=>tone(f,.09,'square',.05),
  hit=()=>{tone(120,.3,'sine',.7,35);noise(.18,.25,3000,400)},whoosh=()=>noise(.5,.3,300,5000,'bandpass',true),
  chime=()=>[880,1319,1760].forEach((f,i)=>setTimeout(()=>tone(f,.7,'sine',.12),i*70)),bass=f=>tone(f,.24,'sawtooth',.09),
  land=(f)=>{tone(200,.15,'sine',.4,60);blip(f)};
const EV=[],ev=(x,f)=>EV.push([x,f]);
for(let k=0;k<12;k++)ev(k*.11,()=>blip(900+(k%3)*200));
for(let k=0;k<12;k++)ev(1.4+k*.058,()=>blip(1400));
for(let i=0;i<6;i++)ev(2.5+i*.5,hit);
LANES.forEach(l=>l.d.forEach(x=>ev(6+(x-100)/1100*2.4,()=>blip(520+x*.6))));
for(let k=0;k<41;k++)ev(9.6+k*.04,()=>blip(300+k*28));
ev(11.2,chime);
S.slice(1,5).forEach(b=>ev(b-.25,whoosh));
for(let i=0;i<6;i++)ev(11.7+.5+i*.08+.3,()=>land(660+i*80));
ev(11.7+4,whoosh);ev(11.7+4.45,hit);
ev(11.7+4.65,()=>{blip(1200);blip(1600)});
for(let i=0;i<4;i++)ev(11.7+4.85+i*.08+.3,()=>land(880+i*110));
ev(11.7+5.95+.25,chime);
const BASS=[55,55,65.41,49],PENT=[440,523.25,587.33,659.25,783.99];
function audioStep(p,c){
  if(!snd||!AC||AC.state!=='running')return;
  EV.forEach(([x,f])=>{if(p<x&&c>=x)f()});
  for(let k=Math.floor(p*4)+1;k*.25<=c;k++){
    const x=k*.25;if(x<2.5)continue;
    if(k%2===0){kick();bass(BASS[Math.floor(k/4)%4])}else hat();
    if(x>=5.7)tone(PENT[(k*3)%5],.12,'triangle',.05);
  }
}
snd=true;
const GE=['pointerdown','touchstart','keydown','click'];
function unlock(){try{initAudio();AC.resume().then(()=>{if(AC.state==='running')GE.forEach(e=>removeEventListener(e,unlock,true))})}catch(e){}}
unlock();GE.forEach(e=>addEventListener(e,unlock,true));
const sn=document.getElementById('sn');
function upd(){const s=(snd&&AC&&AC.state==='running')?'🔊':'🔇';if(sn.textContent!==s)sn.textContent=s}
sn.onclick=async()=>{try{initAudio();if(AC.state!=='running'){await AC.resume();snd=true}else snd=!snd;master.gain.value=snd?.55:0;if(snd)blip(880)}catch(e){}upd()};
let playing=true,t=0,last=performance.now(),prevT=0;
const fmt=x=>String(Math.floor(x)).padStart(2,'0')+':'+String(Math.floor((x%1)*100)).padStart(2,'0');
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){prevT=t;t+=dt;if(t>=D){t=0;prevT=-1}audioStep(prevT,t)}
  render(t);upd();
  requestAnimationFrame(frame);
}
(async()=>{try{await Promise.all([document.fonts.load('100px Anton'),document.fonts.load('700 30px "JetBrains Mono"')])}catch(e){}requestAnimationFrame(n=>{last=n;frame(n)})})();
</script>
</body>
